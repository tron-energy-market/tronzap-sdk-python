[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tronzap-sdk"
dynamic = ["version"]
description = "Official Python SDK for the Tron Energy API by TronZap.com. Buy Tron energy for cheap USDT transfers on TronZap.com"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tron Energy Market", email = "support@tronzap.com"}
]
dependencies = [
    "requests>=2.25.0",
]
keywords = [
    "TronZap",
    "Tron",
    "Trx",
    "Tron API",
    "Trx API",
    "TRX energy",
    "Tron energy",
    "TRON energy api",
    "buy trx energy",
    "buy tron energy",
    "trx energy market",
    "tron energy market",
    "usdt energy",
    "tether energy",
    "USDT",
    "TRC20",
    "TRC-20",
    "cryptocurrency",
    "blockchain",
    "crypto transfers"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://tronzap.com"
Repository = "https://github.com/tron-energy-market/tronzap-sdk-python"
Documentation = "https://docs.tronzap.com/"
Issues = "https://github.com/tron-energy-market/tronzap-sdk-python/issues"
Changelog = "https://github.com/tron-energy-market/tronzap-sdk-python/blob/main/CHANGELOG.md"
"Buy Tron Energy" = "https://tronzap.com"
Support = "https://t.me/tronzap_bot"

[tool.setuptools.dynamic]
version = {attr = "tronzap_sdk.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tronzap_sdk = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"
