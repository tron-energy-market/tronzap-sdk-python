name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows runners default to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        # macOS and Windows are here for the platform-specific network and TLS error classification.
        include:
          # Python 3.9 has no build for Ubuntu 26.04, which ubuntu-latest moves to.
          - os: ubuntu-24.04
            python: '3.9'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install
        run: python -m pip install -r requirements-test.txt -e .

      - name: Test
        run: python -m pytest --cov=tronzap_sdk --cov-branch --cov-report=term-missing --cov-fail-under=90

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt -e .

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src tests examples

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Build
        run: |
          python -m pip install -r requirements-dev.txt
          python -m build
          twine check --strict dist/*

      # Outside the checkout, so the import resolves to the installed wheel and its declared dependencies.
      - name: Install the wheel into an empty environment
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv clean
          clean/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          clean/bin/python -c 'import tronzap_sdk; print(tronzap_sdk.__version__)'
